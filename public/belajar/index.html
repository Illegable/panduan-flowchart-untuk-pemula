<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Belajar Flowchart dari Nol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="menu-btn" aria-label="Buka menu">☰</button>
    <span class="brand">Belajar Flowchart</span>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="side-head">
        <div class="logo">⬭ ▭ ◇</div>
        <h1>Belajar Flowchart<br /><small>dari nol</small></h1>
        <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
        <p id="progressText" class="progress-text"></p>
      </div>
      <nav><ol id="menu" class="menu"></ol></nav>
    </aside>
    <div id="overlay" class="overlay"></div>

    <main class="content">
      <p id="counter" class="counter"></p>
      <article id="lesson" class="lesson"></article>
      <div class="pager">
        <button id="prevBtn" class="btn ghost">← Sebelumnya</button>
        <button id="nextBtn" class="btn">Berikutnya →</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
